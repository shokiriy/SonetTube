<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
        html, body, #player { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    </style>
</head>
<body>
<div id="player-container"></div>
<script>
    const videoId = new URLSearchParams(window.location.search).get('videoId');
    let player;
    const iframe = document.createElement('iframe');
    iframe.id = 'player';
    iframe.title = 'YouTube video player';
    iframe.width = '100%';
    iframe.height = '100%';
    iframe.frameBorder = '0';
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId || '') +
        '?enablejsapi=1&origin=https%3A%2F%2Fappassets.androidplatform.net' +
        '&autoplay=0&controls=1&fs=1&playsinline=1&rel=0';
    document.getElementById('player-container').appendChild(iframe);

    function notify(state) {
        if (window.SonetTubeBridge) window.SonetTubeBridge.onPlayerState(state);
    }
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            events: {
                onStateChange: function(event) {
                    const state = {
                        1: 'playing',
                        2: 'paused',
                        0: 'ended'
                    }[event.data] || 'unknown';
                    notify(state);
                }
            }
        });
    }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
